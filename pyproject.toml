[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "price-of-misread-messages"
version = "0.1.0"
description = "Evaluating language models by the decisions they feed: readers write typed changes to planning data, deterministic checks admit them, a planning model decides, and regret splits into the cost of misreading and the cost of letting a model decide."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "The authors" }]
keywords = [
  "llm-agents",
  "operations-management",
  "supply-chain",
  "information-extraction",
  "structured-output",
  "temporal-knowledge-graph",
  "optimization",
  "regret",
  "benchmark",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pre-commit>=3.7",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "types-PyYAML>=6.0",
]

# Laya typed decision models (condition (e) and the hybrid (j)). Pinned to a release at least
# two weeks old; the project releases several times a week. Pulls in PyTorch and transformers.
laya = [
  "laya==0.4.1",
]

[project.scripts]
cdd = "cdd.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cdd"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "N", "PT", "RUF"]
# The schema docs use mathematical symbols (ŝ, ⊕, τ) and the message templates use en dashes.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Compound assertions read better in small tests.
"tests/**" = ["PT018"]

[tool.ruff.lint.isort]
known-first-party = ["cdd"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*", "laya", "laya.*", "huggingface_hub", "huggingface_hub.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["cdd"]
branch = true
