# Order-promising study, parameter set v1, supply-constrained (surge) setting.
# Identical to promising-v1.yaml except demand_scale: customer orders total 1.3 x the realised
# demand the planner's fixed supply was built for. Added 2026-10-27 by author decision after the
# model-free dev check showed v1 insensitive (docs/research/promising-dev-check.md); chosen on dev
# streams with gold deltas only, before any pilot promising run. Both settings are reported.
margin_fraction: 0.5
lateness_fraction: 0.2
broken_fraction: 0.5
terminal_fraction: 0.5

demand_scale: 1.3
orders_per_week: 3
dirichlet_alpha: 1.0
customer_lead_weeks: [1, 2, 3]
first_requested_offset: 3

max_late_weeks: 2
time_limit: 10
reveal_holds: false
